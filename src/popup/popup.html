<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Lexarach</title>
  <style>
    /* Warna --body / --joint / --accent diisi popup.js dari pengaturan warna Lexarach */
    :root {
      --body: #ff2bd6; --joint: #c6ff00; --accent: #00e5ff;
      --bg: #07080d; --panel: #0d0f17; --line: #1c2030; --text: #d4d9e6; --dim: #7a8196;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      width: 370px; margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .mono { font-family: var(--mono); }

    /* ---------- Header ---------- */
    header { display: flex; gap: 12px; align-items: center; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
    #emblem { width: 52px; height: 52px; flex: none; }
    .title { flex: 1; min-width: 0; }
    .species { font: italic 14px var(--mono); color: var(--body); text-shadow: 0 0 10px color-mix(in srgb, var(--body) 60%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font: 10px var(--mono); color: var(--dim); letter-spacing: .06em; margin-top: 3px; }
    .sub b { color: var(--joint); font-weight: normal; }
    .state { font: 10px var(--mono); padding: 3px 7px; border: 1px solid var(--accent); color: var(--accent); letter-spacing: .1em; }
    .state.hidden { border-color: var(--joint); color: var(--joint); }
    .state.off { border-color: #ff5b6e; color: #ff5b6e; }

    /* ---------- Kehadiran: Aktif / Sembunyikan / Nonaktifkan ---------- */
    .seg { display: flex; border: 1px solid var(--line); }
    .seg button {
      flex: 1; background: none; border: 0; border-right: 1px solid var(--line); color: var(--dim);
      padding: 9px 4px; cursor: pointer; font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    }
    .seg button:last-child { border-right: 0; }
    .seg button:hover { color: var(--text); }
    .seg button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: inset 0 -2px 0 var(--accent); }
    .seg button.on[data-mode="hidden"] { color: var(--joint); background: color-mix(in srgb, var(--joint) 10%, transparent); box-shadow: inset 0 -2px 0 var(--joint); }
    .seg button.on[data-mode="off"] { color: #ff5b6e; background: rgba(255,91,110,.08); box-shadow: inset 0 -2px 0 #ff5b6e; }
    .seg button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
    .hint { font: 11px/1.5 var(--mono); color: var(--dim); margin-top: 8px; }

    /* ---------- Tab ---------- */
    nav { display: flex; border-bottom: 1px solid var(--line); }
    nav button {
      flex: 1; background: none; border: 0; color: var(--dim); padding: 9px 0 8px; cursor: pointer;
      font: 10px var(--mono); letter-spacing: .08em; border-bottom: 2px solid transparent;
    }
    nav button:hover { color: var(--text); }
    nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
    section { display: none; padding: 14px 16px 16px; max-height: 430px; overflow-y: auto; }
    section.on { display: block; }
    section::-webkit-scrollbar { width: 6px; }
    section::-webkit-scrollbar-thumb { background: var(--line); }

    /* ---------- Kartu dengan sudut bracket ---------- */
    .card { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 12px; }
    .card::before, .card::after { content: ''; position: absolute; width: 8px; height: 8px; border-color: var(--accent); border-style: solid; }
    .card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .card::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
    h3 { margin: 0 0 8px; font: 10px var(--mono); color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
    h3 span { color: var(--accent); }

    .meter { display: grid; grid-template-columns: 96px 1fr 30px; gap: 8px; align-items: center; margin: 5px 0; font-size: 12px; }
    .meter .bar { height: 4px; background: var(--line); }
    .meter .bar i { display: block; height: 100%; background: var(--joint); box-shadow: 0 0 6px var(--joint); }
    .meter .v { font: 10px var(--mono); color: var(--dim); text-align: right; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
    .stats div { border: 1px solid var(--line); padding: 6px 2px; }
    .stats b { display: block; font: 16px var(--mono); color: var(--body); }
    .stats small { font: 9px var(--mono); color: var(--dim); letter-spacing: .06em; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { font: 11px var(--mono); padding: 2px 8px; border: 1px solid var(--line); color: var(--text); }
    .chip.hot { border-color: var(--body); color: var(--body); }
    .muted { color: var(--dim); font-size: 12px; }

    /* ---------- Tombol & input ---------- */
    .btn {
      background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 7px 10px;
      font: 11px var(--mono); letter-spacing: .08em; cursor: pointer; text-transform: uppercase;
    }
    .btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent); }
    .btn.warn { color: #ff5b6e; border-color: #ff5b6e; }
    .btn.warn:hover { background: rgba(255,91,110,.1); box-shadow: 0 0 10px rgba(255,91,110,.4); }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    input[type=search] {
      width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      padding: 9px 10px; font: 12px var(--mono); outline: none;
    }
    input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

    /* ---------- Hasil pencarian ---------- */
    .result { display: block; padding: 8px 0; border-bottom: 1px dashed var(--line); text-decoration: none; color: inherit; cursor: pointer; }
    .result:hover .rt { color: var(--accent); }
    .rt { font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rm { font: 10px var(--mono); color: var(--dim); margin: 2px 0 4px; }
    .result .chip { font-size: 10px; padding: 0 6px; }

    /* ---------- Ringkasan ---------- */
    .key { position: relative; padding: 0 0 8px 14px; margin: 0 0 8px; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
    .key::before { content: '▸'; position: absolute; left: 0; color: var(--joint); }
    .key:last-child { border: 0; margin: 0; }

    /* ---------- Mimpi ---------- */

    /* ---------- Setelan ---------- */
    .set { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; font-size: 12px; }
    input[type=color] { width: 40px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; cursor: pointer; }
    input[type=range] { width: 120px; accent-color: var(--accent); }
    input[type=checkbox] { accent-color: var(--accent); }
    .toggle { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; margin: 6px 0; cursor: pointer; }
    .presets { display: flex; gap: 8px; margin-top: 10px; }
    .presets button { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%; cursor: pointer; padding: 0; }
    .presets button:hover { transform: scale(1.12); }
    .disabled { opacity: .35; pointer-events: none; }
    .snip { font-size: 12px; color: #aeb5c6; margin: 4px 0 6px; line-height: 1.5; }
    .snip mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--text); padding: 0 1px; }
    .actions { display: flex; gap: 6px; margin-top: 6px; }
    .actions .btn { padding: 4px 8px; font-size: 10px; }
    .result { cursor: default; }
    select { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 4px 6px; font: 12px var(--mono); }
    .note { padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .note .nt { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 7.5em; overflow: hidden; position: relative; }
    .note .nt.open { max-height: none; }
    .note .more { font: 10px var(--mono); color: var(--accent); cursor: pointer; margin-top: 2px; }
    .note textarea { width: 100%; min-height: 110px; background: var(--panel); color: var(--text); border: 1px solid var(--accent);
      font: 12.5px/1.45 system-ui, sans-serif; padding: 8px; resize: vertical; outline: none; }
    .btn.danger { color: #ff5b6e; border-color: #ff5b6e; }
    .btn.danger:hover { background: rgba(255,91,110,.1); box-shadow: 0 0 10px rgba(255,91,110,.4); }
    body.full { margin: 30px auto; border: 1px solid var(--line); }
    .note-hit { border-left: 2px solid var(--joint); padding-left: 8px; }
    .tag { font: 9px var(--mono); color: var(--joint); letter-spacing: .1em; }
    #backupMsg { font: 11px var(--mono); margin-top: 8px; color: var(--accent); min-height: 14px; }
    footer { padding: 8px 16px; border-top: 1px solid var(--line); font: 9px var(--mono); color: var(--dim); letter-spacing: .1em; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <canvas id="emblem" width="104" height="104"></canvas>
    <div class="title">
      <div class="species" id="species">Lexarach</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="state" id="state">AWAKE</div>
  </header>

  <div id="stale" style="display:none;margin:10px 16px 0;padding:8px 10px;border:1px solid #ff5b6e;color:#ff8a97;font:11px/1.45 var(--mono)"></div>

  <nav>
    <button data-tab="status" class="on" data-i18n="tabStatus"></button>
    <button data-tab="memory" data-i18n="tabMemory"></button>
    <button data-tab="notes" data-i18n="tabNotes"></button>
    <button data-tab="page" data-i18n="tabPage"></button>
    <button data-tab="settings" data-i18n="tabSettings"></button>
  </nav>

  <!-- STATUS -->
  <section id="tab-status" class="on">
    <div class="card">
      <h3 data-i18n="presence"></h3>
      <div class="seg" id="presence" role="radiogroup">
        <button data-mode="normal" role="radio" data-i18n="modeOn"></button>
        <button data-mode="hidden" role="radio" data-i18n="modeHidden"></button>
        <button data-mode="off" role="radio" data-i18n="modeOff"></button>
      </div>
      <div class="hint" id="presenceHint"></div>
    </div>
    <div class="card">
      <h3 data-i18n="personality"></h3>
      <div id="traits"></div>
    </div>
    <div class="card">
      <div class="stats">
        <div><b id="nEaten">0</b><small data-i18n="statWords"></small></div>
        <div><b id="nPages">0</b><small data-i18n="statPages"></small></div>
        <div><b id="nToday">0</b><small data-i18n="statToday"></small></div>
      </div>
    </div>
    <div class="card">
      <h3><b data-i18n="weekTitle" style="font-weight:normal"></b> <span data-i18n="weekSub"></span></h3>
      <div class="stats" style="margin-bottom:8px">
        <div><b id="wPages">0</b><small data-i18n="weekPages"></small></div>
        <div><b id="wNotes">0</b><small data-i18n="weekNotes"></small></div>
        <div><b id="wDays">0</b><small data-i18n="weekDays"></small></div>
      </div>
      <div class="chips" id="wTopics"></div>
    </div>
    <div class="card">
      <h3><b data-i18n="interests" style="font-weight:normal"></b> <span data-i18n="interestsSub"></span></h3>
      <div class="chips" id="interests"></div>
    </div>
  </section>

  <!-- INGATAN -->
  <section id="tab-memory">
    <input type="search" id="q" data-i18n-ph="searchPh" autocomplete="off">
    <div class="muted mono" style="font-size:10px;margin:6px 0 10px" id="qinfo"></div>
    <div id="results"></div>
  </section>

  <!-- CATATAN -->
  <section id="tab-notes">
    <input type="search" id="nq" data-i18n-ph="notesPh" autocomplete="off">
    <div class="muted mono" style="font-size:10px;margin:6px 0 10px" id="ninfo"></div>
    <div id="notes"></div>
  </section>

  <!-- HALAMAN -->
  <section id="tab-page">
    <div class="row" style="margin-bottom:12px">
      <button class="btn" id="summarize" data-i18n="summarize"></button>
      <button class="btn" id="mark" data-i18n="mark"></button>
    </div>
    <div id="summary"><div class="muted" data-i18n="pageIntro"></div></div>
    <div class="card" id="siteCard" style="margin-top:12px">
      <h3><b data-i18n="siteTitle" style="font-weight:normal"></b> <span id="siteHost"></span></h3>
      <select id="siteMode" style="width:100%">
        <option value="normal" data-i18n="siteNormal"></option>
        <option value="hidden" data-i18n="siteHidden"></option>
        <option value="off" data-i18n="siteOff"></option>
      </select>
      <div class="muted" style="font-size:11px;margin-top:6px" data-i18n="siteNote"></div>
      <div class="hint" id="siteOverride" style="color:var(--joint)"></div>
    </div>
  </section>

  <!-- SETEL -->
  <section id="tab-settings">
    <div class="card">
      <h3 data-i18n="language"></h3>
      <select id="lang">
        <option value="id">Bahasa Indonesia</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="card">
      <h3 data-i18n="colors"></h3>
      <label class="toggle"><input type="checkbox" id="auto"> <span data-i18n="autoColor"></span></label>
      <div class="set" id="colorBox" style="margin-top:8px">
        <span data-i18n="cBody"></span><input type="color" id="c-body">
        <span data-i18n="cJoint"></span><input type="color" id="c-joint">
        <span data-i18n="cAccent"></span><input type="color" id="c-accent">
        <span data-i18n="cGlow"></span><input type="range" id="glow" min="0" max="20">
      </div>
      <div class="presets" id="presets"></div>
    </div>
    <div class="card">
      <h3 data-i18n="calmTitle"></h3>
      <label class="toggle"><input type="checkbox" id="calm"> <span data-i18n="calmDesc"></span></label>
    </div>
    <div class="card">
      <h3 data-i18n="backup"></h3>
      <div class="muted" style="font-size:11px;margin-bottom:8px" data-i18n="backupDesc"></div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn" id="exportAll" data-i18n="exportAll"></button>
        <button class="btn" id="importBtn" data-i18n="importBtn"></button>
      </div>
      <div class="row" style="margin-top:8px"><button class="btn" id="exportMd" data-i18n="exportMd"></button></div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      <div id="backupMsg"></div>
    </div>
    <div class="card">
      <h3 data-i18n="privacy"></h3>
      <label class="toggle"><input type="checkbox" id="rememberPages"> <span data-i18n="rememberPages"></span></label>
    </div>
    <div class="row"><button class="btn warn" id="reset" data-i18n="reset"></button></div>
  </section>

  <footer><span data-i18n="footer"></span><span id="ver"></span></footer>

  <script src="../shared/lang.js"></script>
  <script src="popup.js"></script>
</body>
</html>
